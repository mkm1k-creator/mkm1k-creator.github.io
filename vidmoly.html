<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidmoly</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            color: #fff;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2rem;
            letter-spacing: 8px;
            color: #00ff88;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .podtitulek {
            color: #555;
            letter-spacing: 4px;
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        .mrizka {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .video-karta {
            border: 1px solid #222;
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(40px);
        }

        .video-karta.viditelna {
            opacity: 1;
            transform: translateY(0);
        }

        .video-karta:hover {
            border-color: #00ff88;
            box-shadow: 0 0 25px #00ff8822;
            transform: translateY(-5px);
        }

        .video-karta iframe {
            width: 100%;
            height: 240px;
            border: none;
            display: block;
        }

        .video-info { padding: 15px; }

        .video-nazev {
            font-size: 0.95rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 6px;
        }

        .video-popis {
            font-size: 0.75rem;
            color: #555;
            letter-spacing: 2px;
        }

        footer {
            text-align: center;
            margin-top: 60px;
        }

        a.zpet {
            color: #555;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 3px;
            transition: color 0.2s;
        }

        a.zpet:hover { color: #00ff88; }
    </style>
</head>
<body>

    <header>
        <h1>VIDMOLY</h1>
        <p class="podtitulek">VIDEA</p>
    </header>

    <div class="mrizka">

        <div class="video-karta">
            <iframe src="https://vidmoly.biz/embed-m5p4126nehdd.html"
                allowfullscreen></iframe>
            <div class="video-info">
                <div class="video-nazev">Video</div>
                <div class="video-popis">Vidmoly</div>
            </div>
        </div>

    </div>

    <footer>
        <a class="zpet" href="index.html">← ZPĚT DO MENU</a>
    </footer>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry, i) => {
                if (entry.isIntersecting) {
                    setTimeout(() => {
                        entry.target.classList.add('viditelna');
                    }, i * 150);
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.video-karta').forEach(k => observer.observe(k));
    </script>

</body>
</html>

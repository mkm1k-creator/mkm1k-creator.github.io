<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Had</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(circle at 50% 20%, #10241c 0%, #060a08 55%, #030403 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        h1 {
            font-size: 2rem;
            letter-spacing: 8px;
            color: #00ff88;
            margin-bottom: 10px;
            text-transform: uppercase;
            text-shadow: 0 0 20px #00ff8866;
        }

        #skore {
            font-size: 1rem;
            color: #888;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }

        #skore span { color: #00ff88; }

        #wrap {
            position: relative;
        }

        #platno {
            border: 2px solid #00ff88;
            border-radius: 6px;
            box-shadow: 0 0 40px #00ff8833, inset 0 0 60px #00110a;
            display: block;
        }

        #start-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: #050807ee;
            border-radius: 6px;
        }

        #start-screen p {
            color: #666;
            letter-spacing: 2px;
            font-size: 0.8rem;
        }

        #info {
            margin-top: 20px;
            color: #555;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        #game-over {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: #050807ee;
            border-radius: 6px;
        }

        #game-over h2 {
            font-size: 2rem;
            color: #ff4444;
            letter-spacing: 6px;
            text-shadow: 0 0 20px #ff444466;
        }

        #game-over p {
            color: #888;
            letter-spacing: 3px;
        }

        button {
            background: transparent;
            border: 2px solid #00ff88;
            color: #00ff88;
            padding: 10px 30px;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.2s;
            margin: 5px;
            border-radius: 4px;
        }

        button:hover {
            background: #00ff88;
            color: #0a0a0a;
            box-shadow: 0 0 15px #00ff8888;
        }

        a {
            color: #555;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 3px;
            margin-top: 15px;
            transition: color 0.2s;
        }

        a:hover { color: #00ff88; }
    </style>
</head>
<body>

    <h1>HAD</h1>
    <div id="skore">SKÓRE: <span id="cislo">0</span></div>

    <div id="wrap">
        <canvas id="platno" width="400" height="400"></canvas>

        <div id="start-screen">
            <p>WASD nebo ŠIPKY pro ovládání</p>
            <button id="startBtn">SPUSTIT HRU</button>
        </div>

        <div id="game-over">
            <h2>KONEC HRY</h2>
            <p>SKÓRE: <span id="finalni-skore">0</span></p>
            <button onclick="restart()">HRÁT ZNOVU</button>
            <button onclick="window.location='index.html'">MENU</button>
        </div>
    </div>

    <a href="index.html">← ZPĚT DO MENU</a>

    <script>
        const platno = document.getElementById('platno');
        const ctx = platno.getContext('2d');
        const velikostBunky = 20;
        const pocetBunek = 20;
        const startBtn = document.getElementById('startBtn');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over');

        let had, jidlo, smer, dalsiSmer, skore, interval, hraSkoncila, tik;

        function start() {
            had = [{ x: 10, y: 10 }];
            smer = { x: 1, y: 0 };
            dalsiSmer = { x: 1, y: 0 };
            skore = 0;
            hraSkoncila = false;
            tik = 0;
            document.getElementById('cislo').textContent = 0;
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            novéJídlo();
            kreslit();
            if (interval) clearInterval(interval);
            interval = setInterval(update, 120);
        }

        function novéJídlo() {
            do {
                jidlo = {
                    x: Math.floor(Math.random() * pocetBunek),
                    y: Math.floor(Math.random() * pocetBunek)
                };
            } while (had.some(s => s.x === jidlo.x && s.y === jidlo.y));
        }

        function update() {
            tik++;
            smer = dalsiSmer;
            const hlava = { x: had[0].x + smer.x, y: had[0].y + smer.y };

            // Náraz do zdi
            if (hlava.x < 0 || hlava.x >= pocetBunek || hlava.y < 0 || hlava.y >= pocetBunek) {
                konec(); return;
            }

            // Náraz do sebe
            if (had.some(s => s.x === hlava.x && s.y === hlava.y)) {
                konec(); return;
            }

            had.unshift(hlava);

            if (hlava.x === jidlo.x && hlava.y === jidlo.y) {
                skore++;
                document.getElementById('cislo').textContent = skore;
                novéJídlo();
            } else {
                had.pop();
            }

            kreslit();
        }

        function kresliPozadi() {
            // Jemný gradient
            const grad = ctx.createRadialGradient(
                platno.width / 2, platno.height / 2, 20,
                platno.width / 2, platno.height / 2, 300
            );
            grad.addColorStop(0, '#0d1a13');
            grad.addColorStop(1, '#050805');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, platno.width, platno.height);

            // Jemná mřížka
            ctx.strokeStyle = 'rgba(0, 255, 136, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= pocetBunek; i++) {
                ctx.beginPath();
                ctx.moveTo(i * velikostBunky, 0);
                ctx.lineTo(i * velikostBunky, platno.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * velikostBunky);
                ctx.lineTo(platno.width, i * velikostBunky);
                ctx.stroke();
            }
        }

        function kresliJablko() {
            const cx = jidlo.x * velikostBunky + velikostBunky / 2;
            const cy = jidlo.y * velikostBunky + velikostBunky / 2;
            const r = velikostBunky / 2 - 3;

            // Jemné pulzování
            const pulz = 1 + Math.sin(tik * 0.3) * 0.05;

            // Záře
            ctx.save();
            ctx.shadowColor = '#ff4444';
            ctx.shadowBlur = 16;

            // Tělo jablka
            ctx.fillStyle = '#ff3b3b';
            ctx.beginPath();
            ctx.arc(cx, cy + 1, r * pulz, 0, Math.PI * 2);
            ctx.fill();

            // Lesk
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            ctx.beginPath();
            ctx.ellipse(cx - r * 0.35, cy - r * 0.4, r * 0.25, r * 0.15, -0.5, 0, Math.PI * 2);
            ctx.fill();

            // Stopka
            ctx.strokeStyle = '#7a4a26';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy - r);
            ctx.lineTo(cx + 1, cy - r - 5);
            ctx.stroke();

            // Lístek
            ctx.fillStyle = '#3bcf5e';
            ctx.beginPath();
            ctx.ellipse(cx + 4, cy - r - 4, 4, 2.2, 0.6, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function kresliHada() {
            had.forEach((segment, index) => {
                const barva = index === 0 ? '#00ff88' : `hsl(${145 - index * 2}, 90%, ${46 - Math.min(index, 20)}%)`;
                ctx.fillStyle = barva;
                if (index === 0) {
                    ctx.shadowColor = '#00ff88';
                    ctx.shadowBlur = 15;
                }

                const x = segment.x * velikostBunky;
                const y = segment.y * velikostBunky;
                const radius = index === 0 ? 7 : 5;

                ctx.beginPath();
                ctx.roundRect(x + 1, y + 1, velikostBunky - 2, velikostBunky - 2, radius);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            kresliHlavuDetaily();
        }

        function kresliHlavuDetaily() {
            const hlava = had[0];
            const cx = hlava.x * velikostBunky + velikostBunky / 2;
            const cy = hlava.y * velikostBunky + velikostBunky / 2;

            // Jazyk - vysunuje se ve směru pohybu
            if (Math.floor(tik / 4) % 2 === 0) {
                const jazykDelka = 9;
                const tx = cx + smer.x * (velikostBunky / 2 + jazykDelka);
                const ty = cy + smer.y * (velikostBunky / 2 + jazykDelka);
                const baseX = cx + smer.x * (velikostBunky / 2);
                const baseY = cy + smer.y * (velikostBunky / 2);

                ctx.strokeStyle = '#ff3b3b';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(baseX, baseY);
                ctx.lineTo(tx, ty);
                ctx.stroke();

                // Vidlička jazyku
                const kolmoX = -smer.y;
                const kolmoY = smer.x;
                ctx.beginPath();
                ctx.moveTo(tx, ty);
                ctx.lineTo(tx + smer.x * 3 + kolmoX * 2.5, ty + smer.y * 3 + kolmoY * 2.5);
                ctx.moveTo(tx, ty);
                ctx.lineTo(tx + smer.x * 3 - kolmoX * 2.5, ty + smer.y * 3 - kolmoY * 2.5);
                ctx.stroke();
            }

            // Oči - kolmo ke směru pohybu
            const kolmoX = -smer.y;
            const kolmoY = smer.x;
            const ocOffset = 4.5;
            const ocDopredu = 3;

            [1, -1].forEach(strana => {
                const ex = cx + kolmoX * ocOffset * strana + smer.x * ocDopredu;
                const ey = cy + kolmoY * ocOffset * strana + smer.y * ocDopredu;

                // Bílko
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(ex, ey, 3, 0, Math.PI * 2);
                ctx.fill();

                // Zornička dívající se ve směru pohybu
                ctx.fillStyle = '#0a0a0a';
                ctx.beginPath();
                ctx.arc(ex + smer.x * 1.2, ey + smer.y * 1.2, 1.5, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function kreslit() {
            kresliPozadi();
            kresliJablko();
            kresliHada();
        }

        function konec() {
            clearInterval(interval);
            hraSkoncila = true;
            document.getElementById('finalni-skore').textContent = skore;
            gameOverScreen.style.display = 'flex';
        }

        function restart() {
            start();
        }

        document.addEventListener('keydown', e => {
            switch (e.key) {
                case 'ArrowUp': case 'w': case 'W':
                    if (smer.y !== 1) dalsiSmer = { x: 0, y: -1 }; break;
                case 'ArrowDown': case 's': case 'S':
                    if (smer.y !== -1) dalsiSmer = { x: 0, y: 1 }; break;
                case 'ArrowLeft': case 'a': case 'A':
                    if (smer.x !== 1) dalsiSmer = { x: -1, y: 0 }; break;
                case 'ArrowRight': case 'd': case 'D':
                    if (smer.x !== -1) dalsiSmer = { x: 1, y: 0 }; break;
            }
            e.preventDefault();
        });

        startBtn.addEventListener('click', start);

        // Klidová obrazovka před prvním spuštěním
        had = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
        smer = { x: 1, y: 0 };
        jidlo = { x: 15, y: 10 };
        tik = 0;
        kreslit();
    </script>

</body>
</html>

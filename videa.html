<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #fff;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2rem;
            letter-spacing: 8px;
            color: #00ff88;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        p.podtitulek {
            color: #555;
            letter-spacing: 4px;
            margin-bottom: 40px;
            font-size: 0.85rem;
        }

        .video-karta {
            border: 1px solid #222;
            padding: 20px;
            max-width: 640px;
            width: 100%;
            transition: border-color 0.2s;
        }

        .video-karta:hover {
            border-color: #00ff88;
            box-shadow: 0 0 20px #00ff8822;
        }

        .video-karta iframe {
            width: 100%;
            height: 360px;
            border: none;
            display: block;
        }

        .video-info {
            margin-top: 15px;
        }

        .video-nazev {
            font-size: 1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 6px;
        }

        .video-popis {
            font-size: 0.75rem;
            color: #555;
            letter-spacing: 2px;
        }

        a.zpet {
            color: #555;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 3px;
            margin-top: 30px;
            transition: color 0.2s;
        }

        a.zpet:hover { color: #00ff88; }
    </style>
</head>
<body>

    <h1>VIDEA</h1>
    <p class="podtitulek">VÝBĚR SKLADEB</p>

    <div class="video-karta">
        <iframe
            src="https://www.youtube.com/embed/a_cOaRNqjvQ"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
        </iframe>
        <div class="video-info">
            <div class="video-nazev">Homelander Theme | The Boys</div>
            <div class="video-popis">Skladba od Christophera Lennertzea</div>
        </div>
    </div>

    <a class="zpet" href="index.html">← ZPĚT DO MENU</a>

</body>
</html>
